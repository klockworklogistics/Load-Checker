<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mileage">
<meta name="theme-color" content="#0f1923">
<title>Mileage Checker — Klockwork Logistics</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:        #0f1923;
    --surface:   #1a2535;
    --border:    #263348;
    --accent:    #f5a623;
    --green:     #27c97a;
    --red:       #e84c3d;
    --blue:      #3d9bf5;
    --text:      #e8ecf0;
    --muted:     #7a8fa6;
    --input-bg:  #0d1520;
    --radius:    14px;
    --font-mono: 'SF Mono', 'Fira Mono', monospace;
    --font-sans: -apple-system, 'SF Pro Display', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    overscroll-behavior: none;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ── HEADER ── */
  .header {
    padding: 20px 20px 16px;
    padding-top: calc(env(safe-area-inset-top) + 16px);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .header p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-left: 48px;
  }

  /* ── SCROLL BODY ── */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .field-block {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .field-block:last-child { border-bottom: none; }

  .field-dot {
    position: absolute;
    left: -1px;
    top: 0;
    bottom: 0;
    width: 3px;
  }

  .field-dot.current { background: var(--blue); }
  .field-dot.pickup   { background: var(--accent); }
  .field-dot.dropoff  { background: var(--green); }

  .field-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .field-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field-label .tag {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  .tag.current { background: var(--blue); }
  .tag.pickup   { background: var(--accent); }
  .tag.dropoff  { background: var(--green); }

  .gps-btn {
    background: #12283b;
    border: 1px solid #2a4a63;
    color: var(--blue);
    font-size: 11px;
    font-weight: 600;
    border-radius: 8px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .gps-btn:active { background: #163049; }

  .field-block input[type="text"] {
    width: 100%;
    background: var(--input-bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  .field-block input[type="text"]:focus {
    border-color: var(--accent);
    background: #131e2e;
  }

  .field-status {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    min-height: 14px;
  }

  .field-status.ok { color: var(--green); }
  .field-status.err { color: var(--red); }

  /* ── CALC BUTTON ── */
  .calc-btn {
    background: var(--accent);
    color: #1a1204;
    border: none;
    border-radius: var(--radius);
    padding: 16px;
    width: 100%;
    font-size: 16px;
    font-weight: 700;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .calc-btn:active { opacity: 0.8; }
  .calc-btn:disabled { opacity: 0.5; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid #1a120440;
    border-top-color: #1a1204;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .calc-btn.loading .spinner { display: block; }
  .calc-btn.loading .calc-btn-label { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── RESULTS ── */
  .results {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
    display: none;
  }

  .results.show { display: block; }

  .total-miles {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 42px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }

  .total-miles span { font-size: 18px; font-weight: 600; margin-left: 4px; color: var(--muted); }

  .total-sub {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  .results-divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  .leg-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .leg-row:last-child { border-bottom: none; }

  .leg-label {
    font-size: 13px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .leg-label .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  .leg-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .leg-val {
    text-align: right;
    flex-shrink: 0;
    margin-left: 10px;
  }

  .leg-miles {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .leg-time {
    font-size: 11px;
    color: var(--muted);
  }

  .error-box {
    background: #2a0d0d;
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: #ffb3ab;
    display: none;
  }
  .error-box.show { display: block; }

  /* ── RECENT ── */
  .section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 2px;
  }

  .recent-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .recent-item:last-child { border-bottom: none; }
  .recent-item:active { background: #131e2e; }

  .recent-route { font-size: 12px; color: var(--text); line-height: 1.4; }
  .recent-route .arrow { color: var(--muted); margin: 0 5px; }
  .recent-miles { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--accent); flex-shrink: 0; margin-left: 10px; }

  .empty-note { font-size: 12px; color: var(--muted); padding: 14px 16px; text-align: center; }

  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 12px;
    width: 100%;
    font-size: 13px;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .clear-btn:active { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="logo">📍</div>
      <div>
        <h1>Mileage Checker</h1>
      </div>
    </div>
    <p>Klockwork Logistics</p>
  </div>

  <!-- BODY -->
  <div class="body">

    <div class="section-title">Route</div>

    <div class="card">
      <div class="field-block">
        <div class="field-dot current"></div>
        <div class="field-top">
          <span class="field-label"><span class="tag current"></span>Current Location</span>
          <button class="gps-btn" onclick="useGPS('current')">📡 My Location</button>
        </div>
        <input type="text" id="current" placeholder="Where you are now" autocomplete="off">
        <div class="field-status" id="current-status"></div>
      </div>

      <div class="field-block">
        <div class="field-dot pickup"></div>
        <div class="field-top">
          <span class="field-label"><span class="tag pickup"></span>Pickup</span>
          <button class="gps-btn" onclick="useGPS('pickup')">📡 My Location</button>
        </div>
        <input type="text" id="pickup" placeholder="e.g. Atlanta, GA" autocomplete="off">
        <div class="field-status" id="pickup-status"></div>
      </div>

      <div class="field-block">
        <div class="field-dot dropoff"></div>
        <div class="field-top">
          <span class="field-label"><span class="tag dropoff"></span>Dropoff</span>
          <button class="gps-btn" onclick="useGPS('dropoff')">📡 My Location</button>
        </div>
        <input type="text" id="dropoff" placeholder="e.g. Nashville, TN" autocomplete="off">
        <div class="field-status" id="dropoff-status"></div>
      </div>
    </div>

    <button class="calc-btn" id="calc-btn" onclick="calculateMiles()">
      <div class="spinner"></div>
      <span class="calc-btn-label">🧮 Calculate Miles</span>
    </button>

    <div class="error-box" id="error-box"></div>

    <div class="results" id="results">
      <div class="total-miles" id="total-miles">— <span>total mi</span></div>
      <div class="total-sub">Current → Pickup → Dropoff</div>
      <div class="results-divider"></div>

      <div class="leg-row">
        <div class="leg-label">
          <span class="dot" style="background:var(--blue);"></span>
          <div>
            Deadhead
            <div class="leg-sub">Current → Pickup</div>
          </div>
        </div>
        <div class="leg-val">
          <div class="leg-miles" id="leg-deadhead-miles">—</div>
          <div class="leg-time" id="leg-deadhead-time">—</div>
        </div>
      </div>

      <div class="leg-row">
        <div class="leg-label">
          <span class="dot" style="background:var(--green);"></span>
          <div>
            Loaded
            <div class="leg-sub">Pickup → Dropoff</div>
          </div>
        </div>
        <div class="leg-val">
          <div class="leg-miles" id="leg-loaded-miles">—</div>
          <div class="leg-time" id="leg-loaded-time">—</div>
        </div>
      </div>
    </div>

    <div class="section-title">Recent Routes</div>
    <div class="card" id="recent-list">
      <div class="empty-note">Your last few lookups will show here</div>
    </div>

    <button class="clear-btn" onclick="clearAll()">Clear Fields</button>

  </div><!-- /body -->
</div><!-- /app -->

<script>
  const $ = id => document.getElementById(id);
  let recent = [];

  function setStatus(which, text, cls) {
    const el = $(which + '-status');
    el.textContent = text;
    el.className = 'field-status' + (cls ? ' ' + cls : '');
  }

  function useGPS(which) {
    if (!navigator.geolocation) {
      setStatus(which, 'GPS not available on this device/browser', 'err');
      return;
    }
    setStatus(which, 'Getting your location…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        $(which).value = 'My Location';
        $(which).dataset.lat = lat;
        $(which).dataset.lon = lon;
        $(which).dataset.label = 'My Location';
        setStatus(which, `Locked: ${lat.toFixed(4)}, ${lon.toFixed(4)}`, 'ok');
      },
      err => {
        setStatus(which, 'Could not get location — check location permission', 'err');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // If the person types after using GPS, clear the stale coordinates
  ['current', 'pickup', 'dropoff'].forEach(id => {
    $(id).addEventListener('input', () => {
      if ($(id).dataset.label && $(id).value !== $(id).dataset.label) {
        delete $(id).dataset.lat;
        delete $(id).dataset.lon;
        delete $(id).dataset.label;
        setStatus(id, '');
      }
    });
    $(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') calculateMiles();
    });
  });

  async function geocode(query) {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    if (!res.ok) throw new Error('Geocoding service unavailable');
    const data = await res.json();
    if (!data.length) throw new Error(`Couldn't find "${query}"`);
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
  }

  async function resolveLocation(which) {
    const el = $(which);
    if (el.dataset.lat && el.dataset.lon) {
      return { lat: parseFloat(el.dataset.lat), lon: parseFloat(el.dataset.lon), label: el.dataset.label || el.value };
    }
    if (!el.value.trim()) throw new Error(`Enter a "${which}" location`);
    setStatus(which, 'Looking up…');
    const loc = await geocode(el.value.trim());
    setStatus(which, shortLabel(loc.label), 'ok');
    return loc;
  }

  async function driveLeg(a, b) {
    const routeUrl = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
    const res = await fetch(routeUrl);
    if (!res.ok) throw new Error('Routing service unavailable');
    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('No driving route found between two of those points');
    return { meters: data.routes[0].distance, seconds: data.routes[0].duration };
  }

  function fmtTime(seconds) {
    const hours = Math.floor(seconds / 3600);
    const mins = Math.round((seconds % 3600) / 60);
    return (hours > 0 ? hours + 'h ' : '') + mins + 'm';
  }

  async function calculateMiles() {
    const btn = $('calc-btn');
    const errBox = $('error-box');
    errBox.className = 'error-box';
    $('results').className = 'results';

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const [curLoc, pickupLoc, dropLoc] = await Promise.all([
        resolveLocation('current'),
        resolveLocation('pickup'),
        resolveLocation('dropoff')
      ]);

      const [deadhead, loaded] = await Promise.all([
        driveLeg(curLoc, pickupLoc),
        driveLeg(pickupLoc, dropLoc)
      ]);

      const deadheadMiles = deadhead.meters / 1609.34;
      const loadedMiles = loaded.meters / 1609.34;
      const totalMiles = deadheadMiles + loadedMiles;
      const totalSeconds = deadhead.seconds + loaded.seconds;

      $('total-miles').innerHTML = totalMiles.toFixed(1) + ' <span>total mi</span>';
      $('leg-deadhead-miles').textContent = deadheadMiles.toFixed(1) + ' mi';
      $('leg-deadhead-time').textContent = fmtTime(deadhead.seconds);
      $('leg-loaded-miles').textContent = loadedMiles.toFixed(1) + ' mi';
      $('leg-loaded-time').textContent = fmtTime(loaded.seconds);
      $('results').classList.add('show');

      addRecent(shortLabel(curLoc.label), shortLabel(pickupLoc.label), shortLabel(dropLoc.label), totalMiles.toFixed(1));

    } catch (err) {
      errBox.textContent = '⚠️ ' + err.message;
      errBox.classList.add('show');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  function shortLabel(label) {
    if (label === 'My Location') return label;
    const parts = label.split(',').map(s => s.trim());
    return parts.slice(0, 3).join(', ');
  }

  function addRecent(current, pickup, dropoff, miles) {
    recent.unshift({ current, pickup, dropoff, miles });
    recent = recent.slice(0, 6);
    renderRecent();
  }

  function renderRecent() {
    const list = $('recent-list');
    if (!recent.length) {
      list.innerHTML = '<div class="empty-note">Your last few lookups will show here</div>';
      return;
    }
    list.innerHTML = recent.map((r, i) => `
      <div class="recent-item" onclick="reuseRecent(${i})">
        <span class="recent-route">${r.current}<span class="arrow">→</span>${r.pickup}<span class="arrow">→</span>${r.dropoff}</span>
        <span class="recent-miles">${r.miles} mi</span>
      </div>
    `).join('');
  }

  function reuseRecent(i) {
    const r = recent[i];
    $('current').value = r.current;
    $('pickup').value = r.pickup;
    $('dropoff').value = r.dropoff;
    ['current', 'pickup', 'dropoff'].forEach(id => {
      delete $(id).dataset.lat; delete $(id).dataset.lon; delete $(id).dataset.label;
      setStatus(id, '');
    });
    calculateMiles();
  }

  function clearAll() {
    ['current', 'pickup', 'dropoff'].forEach(id => {
      $(id).value = '';
      delete $(id).dataset.lat; delete $(id).dataset.lon; delete $(id).dataset.label;
      setStatus(id, '');
    });
    $('results').className = 'results';
    $('error-box').className = 'error-box';
    $('current').focus();
  }
</script>
</body>
</html>
